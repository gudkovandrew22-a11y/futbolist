<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d4a2c">
<title>Футболист: путь к легенде</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
:root{--bg:#eaf1e6;--bg2:#dfe9da;--card:#ffffff;--card2:#f3f7f0;--line:#d3dfcd;--fg:#13241a;--mu:#5d7266;--acc:#0e8a4b;--acc2:#0a6e3c;--on-acc:#ffffff;--gold:#c98a00;--red:#d0342c;--blue:#2563c9;--hero1:#0d4a2c;--hero2:#16793f;--nx1:#17283d;--nx2:#243f63;--sh:0 1px 2px rgba(19,36,26,.06),0 6px 18px rgba(19,36,26,.07);--w:#12a150;--d:#d29a0a;--l:#d0342c;--bar:#e1eadc;--tabbg:rgba(234,241,230,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08110c;--bg2:#0d1912;--card:#122019;--card2:#182a21;--line:#25382d;--fg:#e6f2ea;--mu:#8ea99a;--acc:#35d07f;--acc2:#5be39a;--on-acc:#04170c;--gold:#ffc83d;--red:#ff6259;--blue:#6aa5ff;--hero1:#0b3a23;--hero2:#146b38;--nx1:#101c2c;--nx2:#1c3354;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--w:#35d07f;--d:#ffc83d;--l:#ff6259;--bar:#1d3026;--tabbg:rgba(8,17,12,.88);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08110c;--bg2:#0d1912;--card:#122019;--card2:#182a21;--line:#25382d;--fg:#e6f2ea;--mu:#8ea99a;--acc:#35d07f;--acc2:#5be39a;--on-acc:#04170c;--gold:#ffc83d;--red:#ff6259;--blue:#6aa5ff;--hero1:#0b3a23;--hero2:#146b38;--nx1:#101c2c;--nx2:#1c3354;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--w:#35d07f;--d:#ffc83d;--l:#ff6259;--bar:#1d3026;--tabbg:rgba(8,17,12,.88);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.4;margin:0;min-height:100vh;background-image:radial-gradient(1200px 500px at 50% -120px,var(--bg2),transparent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:680px;margin:0 auto;padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
#app>*{min-width:0}
h1,h2,h3{font-family:'Oswald','Manrope',system-ui,sans-serif;font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 0 8px}
.ttl{font-size:26px;text-transform:uppercase}
p{margin:0 0 8px}
.mu{color:var(--mu)}
.mu2{color:rgba(255,255,255,.78);font-size:13px}
.note{font-size:13px;text-align:center}
.gap{margin-top:16px}
.good{color:var(--acc);font-weight:700}
small{font-size:11.5px;font-weight:500}
b{font-weight:700}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* buttons */
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;min-height:44px;cursor:pointer;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s;touch-action:manipulation}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.07)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default;filter:none;transform:none}
button small{opacity:.8;width:100%;text-align:center}
button.s,.row button.s{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.r{background:var(--red);color:#fff}
button.on{background:var(--acc);color:var(--on-acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row:first-child{margin-top:0}
.row>button{flex:1 1 130px}
.go button{flex:1 1 90px;min-height:50px;font-size:16px}
.go button:first-child{flex-basis:140px}
/* menu */
.splash{text-align:center;padding:26px 8px 8px}
.splash h1{font-size:40px;text-transform:uppercase;line-height:1.05;background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.splash .sub{color:var(--mu);margin:6px 0 0}
.ball{font-size:56px;animation:roll 6s linear infinite;display:inline-block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
@keyframes roll{to{transform:rotate(360deg)}}
.slot .sl-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.slot .sl-h>div{min-width:0}
.slot .plus{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:22px;color:var(--mu)}
.slot.empty{background:transparent;box-shadow:none;border-style:dashed}
.hr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hr:first-of-type{border-top:0}
.hs{font-family:'Oswald',sans-serif;font-size:24px;color:var(--gold);text-align:right;line-height:1}
.hs small{display:block;font-family:'Manrope',sans-serif;font-size:10.5px;color:var(--mu);max-width:110px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px solid var(--line);border-radius:12px;padding:8px 10px;opacity:.5;filter:grayscale(1);background:var(--card2)}
.ach b{display:block;font-size:13px}
.ach span{font-size:11.5px;color:var(--mu)}
.ach.got{opacity:1;filter:none;border-color:var(--gold);background:linear-gradient(135deg,var(--card2),var(--card))}
.ach.got b::before{content:"🏅 "}
/* form */
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-top:6px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;color:#fff;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 28px,transparent 28px 56px),linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:var(--sh);border:1px solid rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border:2px solid rgba(255,255,255,.12);border-radius:50%}
.hero .av{position:relative;flex:none;width:92px}
.hero .av svg{display:block;width:92px;height:auto}
.hero .ovr{position:absolute;right:-6px;top:-4px;background:var(--gold);color:#1a1200;font-family:'Oswald',sans-serif;font-size:21px;font-weight:700;border-radius:12px;padding:1px 8px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.hero .hi{min-width:0;position:relative;z-index:1}
.hero .nm{font-family:'Oswald',sans-serif;font-size:26px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.hero .cb{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips i{font-style:normal;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 9px;white-space:nowrap}
.bd{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
/* stats */
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.g.g3{grid-template-columns:repeat(3,1fr)}
.g>div{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.g b{display:block;font-family:'Oswald',sans-serif;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.g span{font-size:11px;color:var(--mu);font-weight:600}
.meter{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-top:6px}
.meter>span:last-child{text-align:right}
.bar{height:9px;border-radius:99px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .4s}
.inj{margin-top:10px;background:color-mix(in srgb,var(--red) 14%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);color:var(--red);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px}
/* next match */
.nx{border-radius:20px;padding:12px 14px;color:#fff;background:radial-gradient(400px 120px at 50% 0,rgba(255,255,255,.12),transparent),linear-gradient(135deg,var(--nx1),var(--nx2));box-shadow:var(--sh);border:1px solid rgba(255,255,255,.12)}
.nxt{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8;text-align:center}
.vs{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:6px}
.vm{text-align:center;min-width:0}
.vm b{display:block;font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.vsx{display:block;font-size:11px;opacity:.6;margin:1px 0}
.nx .mu{color:rgba(255,255,255,.75);font-size:12.5px;margin-top:3px}
/* controls */
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.seg .sl{flex:0 0 100%;font-size:11.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.07em}
.seg button,.subs button{flex:1 1 0;min-width:0;min-height:40px;padding:8px 6px;font-size:13px;background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.seg button.on,.subs button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.subs{display:flex;gap:6px}
.dec h2{text-transform:none;letter-spacing:.01em;font-size:20px}
.dtx{color:var(--mu);font-size:14px}
.dec{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent),var(--sh)}
.ob{width:100%;justify-content:flex-start;text-align:left;margin-top:8px;padding:12px 14px}
.ob>span{display:block;width:100%}
.ob small{text-align:left;display:block;margin-top:2px}
.of small{display:block;font-weight:600;opacity:.8;margin-top:2px;line-height:1.35}
.ob.s .of small,.ob.s small{color:var(--mu);opacity:1}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--tabbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:var(--sh)}
.tabs button{flex-direction:column;gap:0;min-height:48px;padding:5px 0;background:transparent;color:var(--mu);border-radius:12px;font-size:10px;min-width:0}
.tabs button span{font-size:19px;line-height:1.1}
.tabs button small{font-size:10px;font-weight:700;opacity:1;line-height:1.1;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
/* match log */
.lg{display:flex;flex-direction:column;gap:8px}
.sline{font-size:13px}
.mr{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--d);border-radius:14px;padding:9px 12px;box-shadow:var(--sh)}
.mr.w{border-left-color:var(--w)}.mr.l{border-left-color:var(--l)}
.mtag{font-size:10.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.07em}
.mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.mt .sc{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:.03em}
.nmx{font-size:12px;color:var(--mu);flex:1 1 100%}
.pd{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12.5px;align-items:center}
.pd.mu{font-weight:600}
.pd .ev,.pd .mi{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:700}
.pd .ev.bad{color:var(--red);border-color:var(--red)}
.rt{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;border-radius:8px;padding:1px 9px;color:#fff}
.rt.hi{background:var(--w);color:#04170c}.rt.md{background:var(--d);color:#1a1200}.rt.lo{background:var(--l);color:#fff}
.tr{padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.tr:first-of-type{border-top:0}
.lg>.tr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
/* tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);text-align:center;padding:4px 3px;font-weight:800}
.tb th:nth-child(2){text-align:left}
.tb td{padding:6px 3px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.tb td:nth-child(2){text-align:left}
.tb td:first-child{font-weight:800;color:var(--mu)}
.tb tr.me td{background:color-mix(in srgb,var(--acc) 18%,transparent);font-weight:800}
.tb tr.z1 td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tb tr.z3 td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tcl{display:inline-flex;align-items:center;gap:7px}
.zk{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:2px}
.zk.z1{background:var(--acc)}.zk.z3{background:var(--red)}.zk.l{background:var(--acc);height:3px;border-radius:2px;width:14px}.zk.b{background:var(--gold);opacity:.6}
.leg{font-size:12px;margin:8px 0 0}
.real{font-weight:800}.fake{color:var(--mu)}
.kor .tr{font-weight:600}
.alive{display:flex;flex-wrap:wrap;gap:6px}
.al{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 9px 3px 5px;font-size:12px;font-weight:700}
.al.me{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
/* attributes */
.at{display:grid;grid-template-columns:minmax(0,1fr) 36px 52px;grid-template-areas:"l v b" "r r r";gap:3px 8px;align-items:center;margin-top:10px}
.at .atl{grid-area:l;display:flex;justify-content:space-between;font-weight:700;font-size:14px;gap:6px}
.at .bar{grid-area:r;height:7px}
.at .atv{grid-area:v;font-family:'Oswald',sans-serif;font-size:19px;text-align:right}
.at button.plus{grid-area:b;min-height:38px;padding:2px 4px;border-radius:10px;font-size:14px}
.at button.plus small{font-size:10px}
/* club / career */
.clh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.clh h2{margin:0}
.fmr{display:flex;align-items:center;gap:6px}
.fm{font-style:normal;font-weight:800;font-size:12px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--d)}
.fm.w{background:var(--w);color:#04170c}.fm.l{background:var(--l)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.ch-ax{stroke:var(--line);stroke-width:1}
.ch-bar{fill:var(--gold);opacity:.55}
.ch-line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--card);stroke:var(--acc);stroke-width:2}
.ch-t{fill:var(--mu);font-size:10px;font-family:'Manrope',sans-serif;font-weight:700}
.mgr{background:var(--card2);border-radius:12px;padding:10px}
.msg{margin-top:10px;font-weight:700;color:var(--gold)}
/* overlay & toast */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.ov .c{width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);max-width:min(92vw,420px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;text-align:center;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.hero .nm{font-size:22px}.hero .av,.hero .av svg{width:76px}.splash h1{font-size:32px}.g b{font-size:18px}}
@media (min-width:900px){#app{max-width:720px}}
/* match center & card */
.mtag{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.rp{min-height:28px;padding:2px 10px;font-size:11.5px;border-radius:999px;background:var(--card2);color:var(--fg);border:1px solid var(--line);text-transform:none;letter-spacing:0}
.ov .c.mc{width:min(480px,100%);max-height:94vh;overflow:hidden}
.mch{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mcl{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.mcl b{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.mcs{text-align:center}
.mcs span{display:block;font-family:'Oswald',sans-serif;font-size:44px;line-height:1;letter-spacing:.04em}
.mcs small{color:var(--mu);font-weight:800}
.mfeed{display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-height:36vh;min-height:90px;padding-right:2px}
.mev{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;animation:pop .2s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mev .mn{font-family:'Oswald',sans-serif;color:var(--mu);min-width:34px;font-size:14px}
.mev.k-g.mi{border-left-color:var(--w);font-weight:800}
.mev.k-g.op{border-left-color:var(--l);font-weight:800}
.mev.k-yc{border-left-color:var(--d)}.mev.k-rc{border-left-color:var(--l)}
.mev.k-x{background:transparent;border-style:dashed;color:var(--mu);font-weight:700}
.mev.pl{box-shadow:inset 0 0 0 1px var(--gold)}
.msum{text-align:center;font-weight:700;padding:6px 0}
.mo{border:2px solid var(--gold);border-radius:14px;padding:10px;background:var(--card2)}
.mo p{color:var(--mu);margin:2px 0 4px;font-size:13.5px}
.ov .c.cardbox{width:min(640px,100%);max-height:94vh;overflow:auto}
.cardbox img{width:100%;height:auto;border-radius:12px;display:block;border:1px solid var(--line)}

/* ui v2: calmer layout */
.c{box-shadow:none;border-radius:16px}
#app{padding-block:12px 104px;gap:10px}
.hero{padding:12px 14px;gap:12px;border-radius:18px}
.hero::after{display:none}
.hero .av{width:60px}
.hero .av svg{width:60px;height:auto}
.hero .ovr{font-size:17px;right:-8px;top:-6px;padding:0 6px;border-radius:9px}
.hero .nm{font-size:22px}
.hero .cb{margin:3px 0 6px;font-size:14px;gap:6px}
.hero .cb small{opacity:.75;font-weight:600;margin-left:2px;font-size:12px}
.chips i{font-size:11px;padding:2px 8px}
.g.stat{margin:0}
.g.stat>div{border:1px solid var(--line);background:var(--card)}
.g.stat b{font-size:20px}
.meter.en{margin:0;padding:0 2px}
.ctl{display:flex;flex-direction:column;gap:8px}
.go{display:grid;grid-template-columns:2fr 1fr;gap:8px}

 return{title:e.t,text:e.x,o:e.o.map((z,j)=>({t:z.t+(z.p&&z.p<1?' · '+Math.round(prb(z)*100)+'%':''),a:'ev',i,j}))}}

function fx(f){const s=S.ss,K=v=>S.cr=cl(S.cr+v,0,100);
 if(f=='g')s.g++;else if(f=='a')s.a++;else if(f=='f+')S.form=Math.min(10,S.form+.4);else if(f=='f-')S.form=Math.max(3,S.form-.6);
 else if(f=='e-')S.energy=Math.max(0,S.energy-15);else if(f=='e+')S.energy=Math.min(100,S.energy+15);
 else if(f=='c+')S.cash+=pc(.1)+val()*.02;else if(f=='c-')S.cash=Math.max(0,S.cash-pc(.3));
 else if(f=='x')applyInj({});else if(f=='r'){S.flop=0;setRole()}else if(f=='flop'){S.flop=1;setRole()}
 else if(f=='k+')K(8);else if(f=='k-')K(-8);else if(f=='k--')K(-16);else if(f=='b')S.out=3;
 else if(f=='pos'){const q=Object.keys(POS).filter(k=>k!=S.pos&&POS[k]==POS[S.pos]);if(q.length){S.pos=pick(q);recalc();setRole()}}
 else if(f=='t'){if(S.phase!='win'&&!S.win){S.log.unshift('🚪 Клуб не отпускает вас до зимнего окна');S.flags.pend=1}else S.dec=windowCard('💱 Запрос на трансфер','Клуб выслушал вас',{})}
 else if(f=='fa')S.fame=cl(S.fame+1,0,99);else if(f=='tp')S.tp+=3;else if(f=='cap'){S.flags.cap=1;S.fame+=1;K(10)}
 else if(f=='A1')S.flags.A1=1;else if(f=='A1x')S.flags.A1=0;else if(f=='A2')S.flags.A2=1;else if(f=='LS')S.flags.ls=1;else if(f=='acad')S.flags.acad=1;
 else if(f.indexOf('a+')==0){const k=f.slice(2);S.A[k]=Math.min(attrCap(),S.A[k]+1);recalc()}}

function offers(opt){
 const c=club(),q=AG[S.ag].q,Y=Yr(),o=[],kc=kOf(S.ci);
 const lv=cl(Math.round((S.ovr-48)/7)+(S.fame>=8?1:0)+(opt.tp?1:0),1,6);
 /* вверх по лестнице: минимум 2 сезона в клубе и нормальный прошлый сезон; в высшем дивизионе без ограничений */
 const h=S.hist[S.hist.length-1],good=!!h&&h.apps>=Math.round((h.n-1)*2*.35)&&+h.rt>=6.4,up=kc>=3||((S.yrs[S.ci]||0)>=2&&good);
 const stp=1+(S.ovr-pw(c,Y)>=10?1:0),kmax=up?Math.min(6,kc+stp):kc;
 const n=2+(q>=2?1:0)+(q>=3?1:0);
 for(let i=0;i<n;i++){
  const kt=cl(Math.min(lv+R(-1,1)+(q&&P(.25*q)?1:0)-(!q&&P(.3)?1:0),kmax),1,6);
  const pool=CL.map((x,j)=>j).filter(j=>j!=S.ci&&kOf(j)==kt&&dvOf(j)>=0&&(opt.lg!=null||kc>=3||CL[j].l==c.l)&&(kt<=kc||pw(CL[j],Y)-S.ovr<=6)&&!o.some(z=>z.c==j)&&(opt.lg==null?(!opt.same||CL[j].l==c.l):CL[j].l==opt.lg)&&(!opt.same||(CL[j].l==c.l&&S.tb[j])));
  if(!pool.length)continue;
  const j=pick(pool),d=S.ovr-pw(CL[j],Y),r=d>=4?'⭐':d>=-3?'✅':d>=-9?'🔄':'🪑';
  const fee=+(val()*(.5+kt*.13+Math.random()*.4)).toFixed(1),w=wgf(kt),y=R(2,5);
  o.push({t:'<span class="of">'+'<b>'+esc(CL[j].n)+'</b> '+r+'<small>'+LG[CL[j].l]+' · '+tlab(j)+'<br>💶 '+fm(fee)+' млн · 💼 '+fm(w)+' млн/год · '+y+' г.</small></span>',a:'move',c:j,f:fee,w,y})}
 if(!opt.same&&S.age<26&&kc>1){const pool=CL.map((x,j)=>j).filter(j=>j!=S.ci&&dvOf(j)>=0&&kOf(j)<kc&&kOf(j)>=kc-2&&(opt.lg==null||CL[j].l==opt.lg));if(pool.length){const j=pick(pool);o.push({t:'🔁 Аренда на сезон: '+esc(CL[j].n)+' · '+LG[CL[j].l],a:'loan',c:j})}}
 return o}

 else o.push({t:'Закрыть окно',a:'stay'});
 offers(Object.assign({same:S.phase!='win'},opt)).forEach(x=>o.push(x));

function doMove(o){const old=club();S.ci=o.c;S.contract=o.y||R(2,5);S.wage=o.w;

function act(i){
 try{
  const o=S.dec&&S.dec.o[i];if(!o)return;
  switch(o.a){
   case 'ev':S.dec=null;evr(o);if(S.dec&&S.dec.title&&S.dec.o)return render();break;
   case 'pk':S.dec=null;pkRes(o);break;
   case 'move':S.prev=S.dec;S.dec=negCard(o);save();return render();
   case 'back':S.dec=S.prev;S.prev=null;save();return render();
   case 'sign':S.dec=null;S.prev=null;doMove(o);break;
   case 'neg':if(P(o.p)){S.dec=null;S.prev=null;const w2=+(o.w*1.2).toFixed(2);doMove(Object.assign({},o,{w:w2}));S.log.unshift('💬 Вы выбили зарплату '+fm(w2)+' млн в год')}
    else{const pv=S.prev;S.prev=null;pv.o=pv.o.filter(x=>x.c!=o.c);S.dec=pv;toastSafe('Клуб отозвал предложение');save();return render()}break;
   case 'loan':S.loan=S.ci;S.ci=o.c;S.flop=0;S.cr=50;setRole();S.log.unshift('🔁 Аренда в '+club().n);S.dec=null;S.prev=null;break;
   case 'renew':S.contract=R(1,4);S.wage=o.w||S.wage;S.dec=null;setRole();break;
   case 'stay':S.dec=null;S.prev=null;break;
   case 'retire':S.dec=null;S.done=true;finishCareer();break;
   default:S.dec=null}
  if(!S.done){if(S.phase=='win'&&!S.dec){S.phase=null;newSeason()}else if(!S.dec)after()}
  save();render();
 }catch(e){errBox(e)}}

function natSeason(Y,lines,trs,fl){
 const NS=NAT[S.ct]||60,Yt=Y+1,ss=S.ss,g=POS[S.pos];
 if(S.age>=18&&S.nat==0&&S.ovr>=NS-14&&P(cl((S.ovr-(NS-14))/20+.15,.1,.9)*(S.form>6.8?1:.7))){S.nat=1;lines.push('🌍 Первый вызов в сборную: '+esc(S.ct));S.fame+=1}
 else if(S.nat==1&&(S.ovr<NS-20||(S.form<5.8&&P(.4)))){S.nat=0;lines.push('🌍 Вас перестали вызывать в сборную')}
 if(S.nat!=1)return;
 const wg={A:.38,M:.13,D:.04,G:0}[g],wa={A:.16,M:.22,D:.07,G:.01}[g];
 const bern=(tg,w)=>{let c=0;for(let i=0;i<tg;i++)if(P(w))c++;return c};
 let caps=R(3,9),cg=bern(caps*1.2,wg*.5*(S.A.sh/70));
 const kind=Yt%4==2?'WC':Yt%4==0?'CT':'';
 if(kind){
  const nm=kind=='WC'?'Чемпионат мира':CONT[REG[S.ct]||'EU'],vals=Object.keys(NAT).map(k=>NAT[k]),top=vals.slice().sort((a,b)=>b-a).slice(0,12);
  const ts=NS+(S.ovr-NS)*.08+R(-3,3);let pts=0,tg=0,ta=0,gp=0,res='';
  const play=(opp)=>{const d=(ts-opp)/34,gf=pois(1.3+d),ga=pois(1.1-d);gp++;const go=bern(gf,wg*.8*(S.A.sh/70)),as=bern(gf-go,wa*.8);tg+=go;ta+=as;return[gf,ga]};
  for(let i=0;i<3;i++){const r=play(cl(pick(vals)+R(-5,5),55,95));pts+=r[0]>r[1]?3:r[0]==r[1]?1:0}
  if(pts>=4||(pts==3&&P(.45))){
   const rn=['1/8 финала','Четвертьфинал','Полуфинал','Финал'];let out=-1;
   for(let i=0;i<4;i++){const r=play(cl(pick(top)+R(-4,6),60,97));let w=r[0]>r[1];if(r[0]==r[1])w=P(.5+(ts-60)/300);if(!w){out=i;break}}
   res=out<0?'🏆 ЧЕМПИОН!':out==3?'🥈 финалист':out==2?'вылет в полуфинале':out==1?'вылет в четвертьфинале':'вылет в 1/8'}
  else res='вылет в группе';
  caps+=gp;cg+=tg;
  lines.push('🌍 '+nm+' '+Yt+': '+res+' ('+tg+' гол., '+ta+' перед.)');
  S.nt.push({y:Yt,nm,res,g:tg,a:ta});
  if(res.indexOf('ЧЕМПИОН')>=0){trs.push(nm+' '+Yt+' (сборная)');S.fame+=kind=='WC'?8:4;S.cash+=pc(kind=='WC'?1:.4);fl.worldCup=kind=='WC';if(kind=='WC')S.flags.wc=1;else S.flags.ec=1}
  else if(res.indexOf('финалист')>=0)S.fame+=2;
 }
 S.tot.caps+=caps;S.tot.cg+=cg}

function movement(c,st,lines){
 const Y=Yr(),me=S.ci,dn3=['высший дивизион','2-й дивизион','3-ю лигу'];
 for(let l=0;l<S.mem.length;l++){const k=relK(l),D=[S.mem[l],S.mem2[l],S.mem3[l]];
  if(!k||D.some(a=>a.length<k*2+1))continue;
  const nz=i=>pw(CL[i],Y)+R(-12,12);
  /* порядок в таблице: у дивизиона игрока — настоящая таблица, у остальных — по силе с шумом */
  const ord=D.map((a,d)=>{
   if(l==c.l&&d==S.div){
    if(st.length==a.length&&st.every(i=>a.indexOf(i)>=0))return st.slice();
    /* таблица не совпадает с составом дивизиона (старое сохранение посреди сезона): ставим вас на то же относительное место */
    const o=a.slice().sort((x,y)=>nz(y)-nz(x)).filter(i=>i!=me),r=Math.max(0,st.indexOf(me));
    o.splice(cl(Math.round(r/Math.max(1,st.length-1)*o.length),0,o.length),0,me);return o}
   return a.slice().sort((x,y)=>nz(y)-nz(x))});
  const dn=[ord[0].slice(-k),ord[1].slice(-k)],up=[ord[1].slice(0,k),ord[2].slice(0,k)];
  const out=(a,b)=>a.filter(i=>b.indexOf(i)<0);
  S.mem[l]=out(D[0],dn[0]).concat(up[0]);
  S.mem2[l]=out(out(D[1],up[0]),dn[1]).concat(dn[0],up[1]);
  S.mem3[l]=out(D[2],up[1]).concat(dn[1]);
  if(l==c.l){const d=S.div;
   if(d==0&&dn[0].indexOf(me)>=0){lines.push('⬇ '+esc(c.n)+' вылетает во 2-й дивизион');S.prevClub=-1;S.flags.rel=1}
   else if(d==1&&up[0].indexOf(me)>=0){lines.push('⬆ '+esc(c.n)+' выходит в высший дивизион!');S.prevClub=-1;S.flags.pro=1}
   else if(d==1&&dn[1].indexOf(me)>=0){lines.push('⬇ '+esc(c.n)+' вылетает в 3-ю лигу');S.prevClub=-1;S.flags.rel=1}
   else if(d==2&&up[1].indexOf(me)>=0){lines.push('⬆ '+esc(c.n)+' выходит во 2-й дивизион!');S.prevClub=-1;S.flags.u3=1}
   else if(d==0){lines.push('⬆ Поднимаются из 2-го дивизиона: '+esc(up[0].map(i=>CL[i].n).join(', ')))}
   else if(d==1){lines.push('⬆ Поднимаются из 3-й лиги: '+esc(up[1].map(i=>CL[i].n).join(', ')))}
  }}
 }
function endSeason(){
 S.phase='win';
 const ss=S.ss,c=club(),Y=Yr(),M=S.rounds.length,avg=ss.apps?ss.rt/ss.apps:0,st=standings(),rank=st.indexOf(S.ci)+1,n=st.length;
 const trs=[],aws=[],lines=[],fl={};
 if(rank==1)trs.push(S.div==2?'Победа в 3-й лиге '+LGT[c.l]+' '+sLab(Y):S.div?'Победа во 2-м дивизионе '+LGT[c.l]+' '+sLab(Y):'Чемпион '+LGT[c.l]+' '+sLab(Y));
 if(S.cup.done&&S.cup.win==S.ci)trs.push(S.cup.n+' '+sLab(Y));
 if(S.eu&&S.eu.done&&S.eu.win==S.ci)trs.push(S.eu.n+' '+sLab(Y));
 const dbl=trs.length>=2;
 if(S.eu){const T=S.eu;lines.push('🏟 '+T.n+': '+(T.done&&T.win==S.ci?'победа!':T.alive.indexOf(S.ci)>=0?'вы в игре':'выбыли'))}
 if(S.cup.res.length)lines.push('🏆 '+S.cup.n+': '+(S.cup.done&&S.cup.win==S.ci?'победа!':S.cup.res[S.cup.res.length-1]));
 natSeason(Y,lines,trs,fl);
 /* awards */
 const topG=R(Math.round(M*.5),Math.round(M*.8)),topA=R(Math.round(M*.3),Math.round(M*.5));
 if(POS[S.pos]=='A'&&ss.g>=topG)aws.push('Золотая бутса '+sLab(Y));
 if(ss.a>=topA&&POS[S.pos]!='G')aws.push('Лучший ассистент '+sLab(Y));
 if(avg>=7.6&&ss.apps>=M*.6&&rank<=6)aws.push('Игрок сезона '+sLab(Y));
 if(S.age<=21&&avg>=7&&ss.apps>=M*.4)aws.push('Лучший молодой игрок '+sLab(Y));
 if(POS[S.pos]=='G'&&ss.cs>=Math.round(M*.35))aws.push('Золотая перчатка '+sLab(Y));
 if(avg>=7.2&&ss.apps>=M*.5)aws.push('Команда года '+sLab(Y));
 if(S.ovr>=86&&avg>=7.6&&ss.apps>=M*.6&&((!S.div&&rank<=3)||fl.worldCup||(S.eu&&S.eu.done&&S.eu.win==S.ci))&&P(.5))aws.push('Золотой мяч '+sLab(Y));
 if(S.div==0)S.flags.top=1;
 if(S.div)for(let i=0;i<aws.length;i++)aws[i]+=' · '+(S.div+1)+'-й див.';
 S.tr.push(...trs);S.aw.push(...aws);
 ['apps','g','a','sv','cs'].forEach(k=>S.tot[k]+=ss[k]);
 if(dbl)S.flags.dbl=1;if(trs.length>=3&&rank==1)S.flags.trip=1;
 if(ss.apps>=M*.95&&!S.flags.injThis)S.flags.iron=1;
 if(S.age<=19&&S.ovr>=75)S.flags.wk=1;
 /* growth */
 const old=S.ovr;
 K6.forEach((k,i)=>{const a=S.age;let d;
  if(a<=21)d=R(1,4);else if(a<=24)d=R(0,3);else if(a<=28)d=R(-1,1);else if(a<=31)d=R(-3,0);else d=R(-4,-1);
  if((k=='s'||k=='ph')&&a>=29)d-=R(0,2);
  if((k=='p'||k=='df')&&a>=29&&a<=33)d+=R(0,1);
  if(a<30){if(S.load==2&&P(.4))d++;if(S.load==0&&P(.4))d--}
  if(S.pt&&P(.5))d++;
  if(d>0&&S.A[k]>=attrCap())d=0;
  S.A[k]=cl(S.A[k]+d,20,97)});
 recalc();const gr=S.ovr-old;
 /* money */
 const inc=S.wage+ss.g*pc(.02)*c.t+ss.a*pc(.01)+S.fame*pc(.15)+(trs.length?pc(.3)*trs.length:0);
 const inv=S.inv>0?+(S.inv*(.85+Math.random()*.5)).toFixed(2):0;
 S.cash+=+(inc*(1-AG[S.ag].f)).toFixed(2)+inv;
 if(inv)lines.push('📈 Инвестиции вернули '+fm(inv)+' млн (вложено '+fm(S.inv)+')');
 lines.push('💶 Доход за сезон: '+fm(inc*(1-AG[S.ag].f))+' млн €');
 S.inv=0;S.pt=0;S.dt=0;
 S.hist.push({y:S.season,yr:Y,age:S.age,club:c.n+(S.loan>=0?' (аренда)':'')+(S.div?' ('+(S.div+1)+' див.)':''),dv:S.div,lg:c.l,apps:ss.apps,g:ss.g,a:ss.a,rt:avg.toFixed(2),rank,n,ovr:S.ovr,tr:trs.length,pos:S.pos});
 S.yrs[S.ci]=(S.yrs[S.ci]||0)+1;
 S.prevRank=rank;S.prevClub=S.ci;movement(c,st,lines);
 /* contract & age */
 if(S.loan>=0){S.ci=S.loan;S.loan=-1;S.prevClub=-1}
 S.age++;S.season++;S.contract--;S.out=0;S.flags.injThis=0;S.flags.A1=0;
 S.log.unshift('📅 Сезон '+sLab(Y)+' завершён: '+rank+'-е место');
 if(S.age>40||(S.age>34&&S.ovr<55)){S.phase=null;S.done=true;S.dec=null;finishCareer();return}
 setRole();
 const head=rank+'-е место из '+n+' · '+S.hist[S.hist.length-1].apps+' матчей, '+ss.g+' гол., '+ss.a+' перед.';
 const txt=(trs.length?'🏆 '+trs.join(', ')+'<br>':'')+(aws.length?'🏅 '+aws.join(', ')+'<br>':'')+'📊 Рейтинг '+S.ovr+' ('+(gr>=0?'+':'')+gr+')<br>'+lines.join('<br>');
 S.dec=windowCard('Итоги сезона '+sLab(Y)+': '+head,txt,{sum:1});

function mgTMore(){
 return'<div class="c"><h2>📖 Правила</h2><div class="rules"><p>🔰 <b>Клуб и дивизионы:</b> вы выбираете страну, называете клуб и начинаете в Третьей лиге. Топ-2 по итогам сезона поднимаются выше, двое последних во Второй и Высшей лиге вылетают. Составы лиг меняются: клубы, занявшие первые места, переходят выше, последние вылетают ниже. Чем выше дивизион, тем больше доход и дороже всё. Высшая лига: чемпионат вашей страны, звёзды 1990–2026 и еврокубки: 1–2 место даёт путёвку в ЛЧ, 3–4 в ЛЕ, 5–6 в ЛК.</p><p>📨 <b>Трансферы:</b> на рынке все игроки 1990–2026, цену можно ограничить фильтром (до 1, до 5 млн и так далее). Купить игрока одним нажатием нельзя: вы делаете предложение, а игрок сам решает. Процент на кнопке — шанс согласия. Он выше у дешёвых игроков, у лидеров таблицы и в высоких лигах: звёзды неохотно идут в Третью лигу. Игроков выше уровня лиги в составе может быть немного: в Третьей лиге один, во Второй два, в Высшей без ограничений. Можно добавить бонус за подпись: он повышает шанс и платится только при согласии. Ответ приходит в конце тура (в предсезонье и если в составе есть пустое место — сразу). Деньги на время резервируются, при отказе возвращаются. За тур можно сделать 3 предложения, из них не больше 1 рискованного (с шансом ниже 60%); до старта сезона — 3 рискованных. Отказавший игрок до конца сезона не вернётся.</p><p>🧩 <b>Состав 15:</b> 2 вратаря, 5 защитников, 5 полузащитников, 3 нападающих. Игроки из любых лет 1990–2026. Нельзя взять двух одинаковых игроков (даже из разных лет и клубов).</p><p>🔄 <b>Схема и расстановка:</b> схему выбираете вы (над полем). У каждой свои плюсы и минусы: например 3-4-3 усиливает атаку, но ослабляет защиту, а 5-4-1 наоборот. При смене схемы состав пересобирается, дальше можно менять игроков одной линии местами со скамейкой.</p><p>🔥 <b>Характер:</b> спокойные игроки почти не ссорятся, скандалисты ссорятся постоянно. Шанс ссоры виден на рынке. В конфликте выбирайте по характеру: со спокойным лучше поговорить, скандалисту нужна твёрдость. Неверное решение снижает стабильность игрока, а при низкой стабильности он играет хуже и ссорится ещё чаще.</p><p>🎖 <b>Авторитет:</b> если тренер всё время уступает, команда перестаёт его уважать: ссор становится больше, а при совсем низком авторитете команда теряет очки. Твёрдые решения авторитет поднимают, но дёргают нервы игроку.</p><p>🎲 <b>Очки:</b> каждый тур игроки случайно набирают очки за выход, голы, передачи, сухие матчи и карточки; бывают травмы. У лучших игроков шансов больше. После каждого тура показан матч: соперник, счёт, голы, передачи и карточки ваших игроков. Матч — это рассказ о туре: счёт зависит от очков вашей команды и соперника, а место в таблице зависит только от очков.</p><p>⭐ <b>Капитан и вице:</b> очки капитана удваиваются, а если он не сыграл, удваиваются очки вице-капитана.</p><p>💰 <b>Баланс:</b> часть очков тура превращается в деньги, но немного: в Третьей лиге копейки, в Высшей заметнее. Главные деньги в премиях: за место в конце сезона (титул в Высшей лиге '+MGPRZ[1][0]+' млн), за повышение (из Третьей лиги +'+MGPRM[3]+', из Второй +'+MGPRM[2]+') и за победу в еврокубке (ЛЧ '+MGCUPZ.CL[0]+', ЛЕ '+MGCUPZ.EL[0]+', ЛК '+MGCUPZ.ECL[0]+').</p><p>💹 <b>Цены:</b> стартовая цена зависит от рейтинга игрока (эпоха не важна: чем выше рейтинг, тем дороже), вратари и защитники чуть дешевле. Потом игроки в форме дорожают, подводящие и травмированные дешевеют. Покупайте до роста и продавайте на пике, но при продаже в сезоне берётся 8%.</p><p>⚠ <b>Риск:</b> чем дороже игрок, тем больше шанс, что он не заиграет. Это видно только через 3 тура: он начнёт давать мало очков. Его можно продать.</p><p>🔁 <b>Трансферы:</b> до первого тура сезона всё бесплатно; дальше не больше 3 покупок за тур.</p><p>💰 <b>Продажа:</b> вкладка «Рынок» → «Продать». Видно, за сколько куплен игрок, как изменилась цена, его голы, передачи и очки. Перед продажей показывается итог, можно сразу выбрать замену.</p><p>📊 <b>Статистика:</b> нажмите на любого игрока (в рынке, составе, таблице бомбардиров): матчи, голы, передачи, сухие матчи, карточки, форма и сколько очков он принёс именно вам.</p><p>🧑‍🏫 <b>Штаб:</b> вкладка «Штаб». Врач, психолог, скаут и тактик получают зарплату каждый тур (до трёх уровней). Они не играют за вас, но снижают риски: травмы, ссоры с тренером, провалы новичков, и немного добавляют очков. Нанимать и увольнять можно в любой момент. Не хватит денег на зарплату — контракты расторгаются.</p><p>📰 <b>События:</b> игроки могут поссориться с тренером (отстранение на 2–4 тура, можно помириться за деньги), получить тяжёлую травму (6–12 туров) или попасть «в ударе» (+2 очка за матч три тура). Иногда спонсор переводит деньги клубу.</p><p>🌍 <b>Мир:</b> на вкладке «Лига» — таблицы 13 чемпионатов, ЛЧ, ЛЕ и ЛК (24 клуба, 8 туров лиговой фазы и плей-офф 1/8, 1/4, 1/2 и финал) и бомбардиры. Результаты случайные, но сильные клубы выигрывают чаще.</p><p>🏆 <b>Еврокубки как турнир:</b> выберите ЛЧ/ЛЕ/ЛК — очки получают только игроки клубов, которые играют в этом туре. Клуб вылетел — его игроки больше не приносят очков: продайте их и купите игроков клубов, которые остались (такая замена не считается в лимите покупок). Еврокубок открывается только по путёвке из чемпионата Высшей лиги.</p></div></div>'
 +'<div class="c"><div class="row"><button class="s" onclick="mgExit()">🏠 В меню</button></div><div class="row"><button class="'+(MU.del?'r':'s')+'" onclick="mgDel2()">'+(MU.del?'⚠ Нажмите ещё раз: удалить режим':'🗑 Начать режим заново')+'</button></div></div>'}

const FLG_ISO={AR:'Аргентина',BR:'Бразилия',DE:'Германия',ES:'Испания',FR:'Франция',IT:'Италия',NL:'Нидерланды',PT:'Португалия',RU:'Россия',SA:'Саудовская Аравия',TR:'Турция',US:'США',BE:'Бельгия',HR:'Хорватия',RS:'Сербия',PL:'Польша',UA:'Украина',SE:'Швеция',NO:'Норвегия',DK:'Дания',CH:'Швейцария',UY:'Уругвай',CO:'Колумбия',MX:'Мексика',JP:'Япония',KR:'Южная Корея',NG:'Нигерия',SN:'Сенегал',MA:'Марокко',EG:'Египет',GB:'Англия'};
const flagSvg=n=>FLG[n]?'<svg class="flg" viewBox="0 0 30 20" preserveAspectRatio="none" role="img" aria-label="'+n+'" focusable="false">'+FLG[n]+'</svg>':'';
const cf=n=>FLG[n]?flagSvg(n)+esc(n):'🌍 '+esc(n);                                  /* флаг + название страны */
/* эмодзи-флаги и чёрный флаг (Англия) в любом тексте -> SVG */
const FLG_RE=/[\u{1F1E6}-\u{1F1FF}]{2}|\u{1F3F4}[\u{E0020}-\u{E007F}]*/gu;
function flagify(root){
 if(!root||!root.nodeType)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];
 for(let n=w.nextNode();n;n=w.nextNode()){const v=n.nodeValue;if(v&&/[\u{1F1E6}-\u{1F3F4}]/u.test(v)){FLG_RE.lastIndex=0;if(FLG_RE.test(v))list.push(n)}}
 list.forEach(n=>{
  const par=n.parentNode;if(!par||/^(OPTION|TEXTAREA|SCRIPT|STYLE|TITLE)$/.test(par.nodeName))return;
  const t=n.nodeValue,fr=document.createDocumentFragment();let last=0,hit=0;
  FLG_RE.lastIndex=0;
  t.replace(FLG_RE,(m,i)=>{
   const nm=m.codePointAt(0)==0x1F3F4?'Англия':FLG_ISO[String.fromCharCode(m.codePointAt(0)-0x1F1E6+65,m.codePointAt(2)-0x1F1E6+65)];
   if(nm&&FLG[nm]){fr.append(t.slice(last,i));const tp=document.createElement('template');tp.innerHTML=flagSvg(nm);fr.append(tp.content);last=i+m.length;hit=1}
   return m});
  if(!hit)return;
  fr.append(t.slice(last));par.replaceChild(fr,n)})}
try{
 new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType==1)flagify(n);else if(n.nodeType==3&&n.parentNode&&n.parentNode.nodeType==1)flagify(n.parentNode)}))}).observe(document.body,{childList:true,subtree:true});
 flagify(document.body);
}catch(e){console.error(e)}
/* ===== выпадающий список с флагами (обычный select флаги не показывает) ===== */
/* items: [{v,h}] или заголовок группы {hdr}; h — готовый HTML. cb — имя глобальной функции, получит выбранное значение. Значение лежит в <input id> */
function fsel(id,items,sel,cb){
 const opts=items.filter(x=>x.hdr==null),cur=opts.find(x=>String(x.v)==String(sel))||opts[0];
 return'<div class="fs" id="fs-'+id+'"><input type="hidden" id="'+id+'" value="'+esc(cur.v)+'"'+(cb?' data-cb="'+cb+'"':'')+'>'
 +'<button type="button" class="fs-b" id="'+id+'-b" aria-haspopup="listbox" aria-expanded="false" onclick="fsTog(\''+id+'\')"><span class="fs-t">'+cur.h+'</span><i aria-hidden="true"></i></button>'
 +'<div class="fs-l" role="listbox" hidden>'+items.map(x=>x.hdr!=null?'<div class="fs-g">'+esc(x.hdr)+'</div>':'<button type="button" role="option" class="fs-o'+(x===cur?' on':'')+'" aria-selected="'+(x===cur)+'" data-v="'+esc(x.v)+'" onclick="fsPick(\''+id+'\',this)">'+x.h+'</button>').join('')+'</div></div>'}
function fsClose(){document.querySelectorAll('.fs-l').forEach(l=>{l.hidden=true});document.querySelectorAll('.fs-b').forEach(b=>b.setAttribute('aria-expanded','false'))}
function fsTog(id){const box=document.getElementById('fs-'+id);if(!box)return;const l=box.querySelector('.fs-l'),open=l.hidden;fsClose();
 if(open){l.hidden=false;box.querySelector('.fs-b').setAttribute('aria-expanded','true');const on=l.querySelector('.on');if(on)l.scrollTop=Math.max(0,on.offsetTop-l.clientHeight/2+on.offsetHeight/2)}}
function fsPick(id,o){const box=document.getElementById('fs-'+id),inp=document.getElementById(id);if(!box||!inp)return;
 inp.value=o.getAttribute('data-v');box.querySelector('.fs-t').innerHTML=o.innerHTML;
 box.querySelectorAll('.fs-o').forEach(x=>{const on=x===o;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false')});
 fsClose();const cb=inp.getAttribute('data-cb');if(cb&&typeof window[cb]=='function')window[cb](inp.value);else box.querySelector('.fs-b').focus()}
document.addEventListener('click',e=>{if(!(e.target&&e.target.closest&&e.target.closest('.fs')))fsClose()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')fsClose()});
